# Copy this file to .github/workflows/publish-knowledge.yml in the PRIVATE
# knowledge repository. That repository should contain knowledge/ at its root.
name: Publish Khyati knowledge

on:
  push:
    branches: [main]
    paths: ["knowledge/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: khyati-knowledge-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.KHYATI_APP_REPOSITORY }}
          path: _khyati_app
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate and build manifest
        env:
          RELEASE_PREFIX: releases/${{ github.sha }}
        run: |
          python _khyati_app/scripts/build_knowledge_manifest.py \
            --source knowledge \
            --version "${{ github.sha }}" \
            --release-prefix "$RELEASE_PREFIX" \
            --output manifest.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_KNOWLEDGE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish immutable release, then atomic pointer
        id: publish
        env:
          BUCKET: ${{ vars.KHYATI_KNOWLEDGE_BUCKET }}
          RELEASE_PREFIX: releases/${{ github.sha }}
        run: |
          test "$(aws s3api get-bucket-versioning --bucket "$BUCKET" --query Status --output text)" = "Enabled"
          previous_version=$(aws s3api head-object --bucket "$BUCKET" --key current/manifest.json --query VersionId --output text 2>/dev/null || true)
          echo "previous_version=$previous_version" >> "$GITHUB_OUTPUT"
          aws s3 sync knowledge "s3://$BUCKET/$RELEASE_PREFIX/" --no-progress
          aws s3 cp manifest.json "s3://$BUCKET/$RELEASE_PREFIX/manifest.json" --no-progress
          aws s3 cp manifest.json "s3://$BUCKET/current/manifest.json" --no-progress
      - name: Restart listener through SSM
        id: reload
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Reload Khyati knowledge ${{ github.sha }}" \
            --parameters 'commands=sudo systemctl restart khyati,sleep 20,sudo systemctl is-active khyati' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
      - name: Roll back knowledge pointer after failed reload
        if: ${{ steps.reload.outcome == 'failure' && steps.publish.outputs.previous_version != '' && steps.publish.outputs.previous_version != 'None' }}
        env:
          BUCKET: ${{ vars.KHYATI_KNOWLEDGE_BUCKET }}
          PREVIOUS_VERSION: ${{ steps.publish.outputs.previous_version }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws s3api copy-object \
            --bucket "$BUCKET" \
            --key current/manifest.json \
            --copy-source "$BUCKET/current/manifest.json?versionId=$PREVIOUS_VERSION"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=sudo systemctl restart khyati' >/dev/null
      - name: Fail deployment when reload failed
        if: ${{ steps.reload.outcome == 'failure' }}
        run: exit 1
