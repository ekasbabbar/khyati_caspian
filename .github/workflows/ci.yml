name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m py_compile channels.py config.py khyati/service.py khyati/caspian_loop.py khyati/storage/postgres.py khyati/knowledge/sources.py
